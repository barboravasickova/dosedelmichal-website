<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Na webu se pracuje. Brzy tu bude něco nového.">
  <title>Na webu se pracuje | dosedelmichal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
    <div class="content">
      <div class="badge" aria-hidden="true">
        <span class="badge-dot"></span>
        Probíhají úpravy
      </div>

      <h1>Na webu se pracuje</h1>

      <p class="lead">
        Právě připravujeme nový web. Děkujeme za trpělivost — brzy tu bude něco nového.
      </p>

      <div class="progress" role="presentation" aria-hidden="true">
        <span class="progress-bar"></span>
      </div>
    </div>

    <footer class="footer">
      <p>&copy; <span id="year"></span> dosedelmichal</p>
    </footer>
  </main>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
